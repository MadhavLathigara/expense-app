<!doctype html>
<html lang="en" data-theme="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Expense Tracker</title>
<meta name="description" content="Private daily expense tracker. Your data stays on your device.">
<meta name="theme-color" content="#111114">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ---- colour themes: P = main colour, PD = main colour in dark mode, A = accent, T = third, H1/H2 = header ---- */
[data-theme="teal"]  {--P:#1E7A73;--PD:#5FC4B8;--A:#E07A5F;--T:#D99A2B;--H1:#1E7A73;--H2:#134E4A;--onP:#fff;--onPD:#08201E;--onA:#fff}
[data-theme="purple"]{--P:#5B3CC4;--PD:#A995F5;--A:#FF7A59;--T:#E3A21A;--H1:#6A45D8;--H2:#35207E;--onP:#fff;--onPD:#1A1240;--onA:#fff}
[data-theme="gold"]  {--P:#1F1F24;--PD:#E2B64B;--A:#D9A21B;--T:#2F9E6E;--H1:#2E2E35;--H2:#111114;--onP:#fff;--onPD:#1A1406;--onA:#1A1406}
[data-theme="wine"]  {--P:#9B2C5A;--PD:#F28DB2;--A:#F08A5D;--T:#C9971C;--H1:#A8325F;--H2:#5C1636;--onP:#fff;--onPD:#2A0816;--onA:#fff}
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --text:#1E2230; --muted:#6B7080; --line:#E7E8EE;
  --pri:var(--P); --on-pri:var(--onP); --acc:var(--A); --on-acc:var(--onA); --third:var(--T); --big:var(--H2);
  --pri-l:#EEF0F4; --acc-l:#FDF0EA; --red:#C8443A; --green:#22885A; --red-l:#FBEAEA; --green-l:#E5F4EC;
  --shadow:0 1px 2px rgba(20,20,40,.05),0 4px 14px rgba(20,20,40,.06);
  --radius:16px; --nav-h:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@supports (color: color-mix(in srgb, red 50%, blue)){
  :root{ --bg:color-mix(in srgb, var(--P) 4%, #F6F7F9); --line:color-mix(in srgb, var(--P) 10%, #E8E9EE);
    --pri-l:color-mix(in srgb, var(--pri) 11%, var(--card)); --acc-l:color-mix(in srgb, var(--acc) 15%, var(--card));
    --red-l:color-mix(in srgb, var(--red) 12%, var(--card)); --green-l:color-mix(in srgb, var(--green) 13%, var(--card)); }
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0D0F14; --card:#171A21; --text:#E8EAF0; --muted:#9AA0AE; --line:#2A2E38;
    --pri:var(--PD); --on-pri:var(--onPD); --big:var(--PD); --red:#F07167; --green:#5CC98A;
    --pri-l:#232733; --acc-l:#2E241F; --red-l:#33201F; --green-l:#1C2E25; --shadow:none; color-scheme:dark; }
  @supports (color: color-mix(in srgb, red 50%, blue)){
    :root{ --bg:color-mix(in srgb, var(--P) 9%, #0B0D12); --card:color-mix(in srgb, var(--P) 7%, #15181F);
      --line:color-mix(in srgb, var(--PD) 16%, #252932);
      --pri-l:color-mix(in srgb, var(--pri) 16%, var(--card)); --acc-l:color-mix(in srgb, var(--acc) 18%, var(--card));
      --red-l:color-mix(in srgb, var(--red) 15%, var(--card)); --green-l:color-mix(in srgb, var(--green) 15%, var(--card)); }
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* no double-tap zoom */
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--sab) + 16px);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}

/* ---------- layout ---------- */
header.top{background:linear-gradient(160deg,var(--H1),var(--H2));color:#fff;
  padding:calc(var(--sat) + 14px) 18px 18px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:980px;margin:0 auto}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
.top .sub{opacity:.8;font-size:13px}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
  border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 12px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:860px){ .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start} }

/* hero */
.hero{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line);
  margin-top:-4px;margin-bottom:14px}
.hero .label{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.hero .big{font-size:34px;font-weight:800;color:var(--big);margin:2px 0 10px;letter-spacing:-.5px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:12px;padding:10px 12px}
.mini .label{font-size:11px}
.mini .val{font-size:18px;font-weight:700}
.mini.coral{background:var(--acc-l)} .mini.coral .label{color:var(--acc)}
.mini.teal{background:var(--pri-l)} .mini.teal .label{color:var(--pri)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{border-radius:14px;padding:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.stat .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:clamp(14px,3.9vw,19px);font-weight:800;margin-top:2px;white-space:nowrap;line-height:1.25;letter-spacing:-.2px}
.stat.c1 .label{color:var(--acc)} .stat.c2 .label{color:var(--pri)} .stat.c3 .label{color:var(--third)}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar.over > i{background:var(--red)}

/* list */
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-size:13px;font-weight:700;color:var(--muted)}
.list{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--pri-l)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:700;white-space:nowrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .e{font-size:40px}

/* breakdown rows */
.brow{padding:9px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .top2{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brow .name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .ico{width:30px;height:30px;font-size:15px;border-radius:9px}
.brow .note{font-size:12px;color:var(--muted);margin-top:4px}
.brow .note.over{color:var(--red);font-weight:600}
a.link, button.link, .link{color:var(--pri);font-weight:600}

/* month/year switcher */
.switch{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:6px;margin-bottom:14px;box-shadow:var(--shadow)}
.switch .lbl{font-weight:700;font-size:16px}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--pri)}
.iconbtn:hover{background:var(--pri-l)}

/* charts */
svg.chart{width:100%;height:auto;display:block;max-width:600px;margin:0 auto}
.chart text{fill:var(--muted);font-size:11px}
.chart text.v{font-size:9.5px;font-weight:600}

/* table */
table.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--pri-l)}
.tbl tr.total td{font-weight:800;border-bottom:0}
.pos{color:var(--green);font-weight:600} .neg{color:var(--red);font-weight:600}

/* settings */
.srow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.srow:last-child{border-bottom:0}
.srow .mid{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:700}
.btn.primary{background:var(--pri);color:var(--on-pri)}
.btn.coral{background:var(--acc);color:var(--on-acc)}
.btn.give{background:var(--red);color:#fff}
.btn.get{background:var(--green);color:#fff}
.btn.ghost{background:var(--pri-l);color:var(--pri)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.block{width:100%}
.btns{display:grid;gap:10px}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--acc-l);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.banner .x{margin-left:auto;font-size:18px;color:var(--muted);padding:0 4px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:var(--sab);box-shadow:0 -2px 12px rgba(0,0,0,.05)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);height:100%;justify-content:center}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--pri)}
.fab{width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;margin:0 auto;
  box-shadow:0 6px 16px rgba(0,0,0,.22);transform:translateY(-14px)}
.fab svg{width:28px;height:28px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,25,24,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;
  animation:fade .15s ease}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;
  padding:8px 18px calc(18px + var(--sab));animation:up .2s ease}
@media (min-width:700px){ .overlay{align-items:center} .sheet{border-radius:22px;padding-bottom:20px} }
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet{position:relative;overscroll-behavior:contain}
.sheet-top{position:sticky;top:0;height:0;z-index:5}
.sheet-x{position:absolute;right:-6px;top:4px;width:38px;height:38px;border-radius:50%;background:var(--pri-l);color:var(--text);
  display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .12s ease}
.sheet-x svg{width:18px;height:18px}
.sheet-x:active{transform:scale(.88)}
.sheet h3{padding-right:46px}
.sheet h3{margin:0 0 14px;font-size:18px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{margin-bottom:14px}
.field > label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--pri)}
.amount-wrap{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;padding:4px 14px;background:var(--bg)}
.amount-wrap:focus-within{border-color:var(--pri)}
.amount-wrap span{font-size:28px;font-weight:700;color:var(--muted)}
.amount-wrap input{border:0;background:transparent;font-size:32px;font-weight:800;width:100%;padding:8px 6px;outline:none}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.chip{border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12.5px;font-weight:600;text-align:center;line-height:1.2;background:var(--card)}
.chip .em{font-size:20px}
.chip.on{border-color:var(--pri);background:var(--pri-l);box-shadow:inset 0 0 0 1px var(--pri)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;background:var(--card)}
.pill.on{border-color:var(--pri);background:var(--pri);color:var(--on-pri)}
.datebar{display:flex;gap:8px;align-items:center}
.datebar .inp{flex:1}
.actions{position:sticky;bottom:calc(-18px - var(--sab));background:var(--card);margin:0 -18px;padding:10px 18px calc(18px + var(--sab));border-top:1px solid var(--line)}
@media (min-width:700px){ .actions{bottom:-20px;padding-bottom:20px} }
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin:-4px 0 8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--text)}
@media (pointer:coarse){ .tip-plus{display:none} }
/* people */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.bal{text-align:right;white-space:nowrap}
.bal .amt{font-weight:800}
.bal .lb{font-size:11.5px;font-weight:600}
.cg{color:var(--green)} .cr{color:var(--red)}
.sumcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.sumcard{border-radius:16px;padding:14px;border:1px solid var(--line)}
.sumcard.g{background:var(--green-l)} .sumcard.r{background:var(--red-l)}
.sumcard .label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.sumcard .val{font-size:clamp(17px,5vw,24px);font-weight:800;margin-top:2px}
.pcard{text-align:center}
.pcard .av{width:56px;height:56px;font-size:20px;margin:0 auto 8px}
.pcard .big2{font-size:30px;font-weight:800;letter-spacing:-.5px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--pri);font-weight:700;margin:0 0 12px}
.arrow{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:800;flex:none}
.arrow.gave{background:var(--red-l);color:var(--red)} .arrow.got{background:var(--green-l);color:var(--green)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:1.5px solid var(--line);border-radius:12px;padding:11px;font-weight:700}
.seg button.on.gave{background:var(--red);border-color:var(--red);color:#fff}
.seg button.on.got{background:var(--green);border-color:var(--green);color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 14px}
/* home shortcut tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;box-shadow:var(--shadow);min-width:0}
.tile .ti{font-size:21px;line-height:1}
.tile .tl{font-weight:700;font-size:14px;margin-top:6px}
.tile .tv{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tile .tv.cg{color:var(--green)}
.tile:active{transform:scale(.95)}
/* notes */
.notes-grid{display:grid;gap:10px}
@media (min-width:700px){ .notes-grid{grid-template-columns:1fr 1fr} }
.note-card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.note-card .nt{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-card .np{font-size:13.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-card .nd{color:var(--text);font-weight:600}
.note-card.flash{animation:flash 1.6s ease both}
.note-card:active{transform:scale(.985)}
.sheet.full{max-width:760px;height:100vh;height:100dvh;max-height:none;border-radius:0;display:flex;flex-direction:column;padding-top:calc(var(--sat) + 8px)}
.sheet.full .grab{display:none}
@media (min-width:700px){ .sheet.full{height:86vh;border-radius:22px;padding-top:12px} }
.ned-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0 4px}
.ned-meta{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 8px}
.ned{flex:1;width:100%;border:0;outline:none;resize:none;background:transparent;color:var(--text);font:17px/1.6 inherit;font-family:inherit;padding:4px 2px 40px}
.iconbtn.on{background:var(--pri-l)}
.gear.on{background:rgba(255,255,255,.32)}
/* header back button */
.hback{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;flex:none;transition:transform .12s ease}
.hback svg{width:22px;height:22px}
.hback:active{transform:scale(.9)}
.top h1,.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* header gear + theme picker */
.gear{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.gear svg{width:22px;height:22px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.th{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;font-weight:700;font-size:13.5px}
.th.on{border-color:var(--pri)}
.th .sw2{display:flex;height:34px;border-radius:9px;overflow:hidden;margin-bottom:8px}
.th .sw2 i{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sab) + 18px);transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1);background:#1D2B2A;color:#fff;
  padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:90vw;text-align:center}

/* ================= animations ================= */
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes down{to{transform:translateY(60px);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes flash{0%{background:var(--acc-l);box-shadow:inset 4px 0 0 var(--acc)}70%{background:var(--acc-l)}100%{background:transparent;box-shadow:inset 0 0 0 transparent}}
@keyframes leave{to{opacity:0;transform:translateX(60px);height:0;padding-top:0;padding-bottom:0;border-width:0}}
.rise{animation:rise .45s cubic-bezier(.2,.75,.2,1) both}
main.slide-l{animation:slideL .32s cubic-bezier(.2,.75,.2,1) both}
main.slide-r{animation:slideR .32s cubic-bezier(.2,.75,.2,1) both}
main.fresh .bar > i{transform-origin:left center;animation:growX .8s cubic-bezier(.2,.75,.2,1) .15s both}
main.fresh svg.chart rect.b{transform-box:fill-box;transform-origin:center bottom;animation:growY .6s cubic-bezier(.2,.75,.2,1) both}
main.fresh svg.chart text.v{animation:fadeIn .4s ease .5s both}
.item.flash{animation:flash 1.6s ease both}
.leaving{animation:leave .28s ease forwards;overflow:hidden}
.overlay.closing{animation:fadeOut .2s ease forwards;pointer-events:none}
.overlay.closing .sheet{animation:down .2s ease forwards}
.overlay{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.btn,.fab,.chip,.pill,.item,.srow,.th,.iconbtn,.tab,.gear,.seg button{transition:transform .12s ease, background-color .2s ease, border-color .2s ease}
.btn:active,.chip:active,.pill:active,.th:active,.seg button:active,.gear:active{transform:scale(.95)}
.item:active,.srow:active{transform:scale(.985)}
.iconbtn:active{transform:scale(.88)}
.fab:active{transform:translateY(-14px) scale(.9)}
.tab:active{transform:scale(.9)}
.tab.on svg{animation:pop .4s ease}
.chip.on .em{display:inline-block;animation:pop .35s ease}
.pill.on,.seg button.on{animation:pop .3s ease}
.conf{position:fixed;width:9px;height:14px;border-radius:2px;z-index:70;pointer-events:none;left:50%;top:42%}
html.theme-fade, html.theme-fade *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease!important}
/* on/off switch */
.switch2{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background-color .2s ease}
.switch2::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.switch2.on{background:var(--pri)}
.switch2.on::after{transform:translateX(20px)}
/* respect "reduce motion" on the phone/PC, and the in-app switch */
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
html.no-anim *, html.no-anim *::before, html.no-anim *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="row" style="gap:10px;min-width:0">
      <button class="hback hidden" id="hBack" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div style="min-width:0">
        <h1 id="title">Expenses</h1>
        <div class="sub" id="subtitle"></div>
      </div>
    </div>
    <div class="row" style="gap:8px"><button class="gear" data-tab="notes" aria-label="Notes" title="Notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg></button>
    <button class="gear" data-tab="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </div>
</header>
<main id="main"></main>

<nav class="tabs" aria-label="Main">
  <div class="in">
    <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="tab" data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Month</button>
    <div><button class="fab" id="fab" aria-label="Add expense"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <button class="tab" data-tab="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Year</button>
    <button class="tab" data-tab="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.3-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.1 4.5 1.9 5 4.6"/></svg>People</button>
  </div>
</nav>
<input type="file" id="restoreFile" accept=".json,application/json" class="hidden">

<script>
"use strict";
/* =========================================================
   Data (stored only on this device, in localStorage)
   Amounts are stored in paise (whole numbers) to avoid rounding errors.
   ========================================================= */
const KEY = "expense-tracker-data-v1";
const COLORS = ["#E07A5F","#1E7A73","#F2A541","#5B8DEF","#8E6CCF","#3FA34D","#D9577A","#2BB3B1","#B5835A","#6C7A89","#C4A21C","#4F6D7A"];
const DEFAULT_CATS = [
  ["🛒","Food & Groceries"],["🍽️","Eating Out"],["⛽","Transport / Fuel"],["🏠","Rent"],["💡","Bills"],["🛍️","Shopping"],
  ["💊","Health"],["🎬","Entertainment"],["📚","Education"],["🎁","Family / Gifts"],["🏦","EMI / Loan"],["📦","Other"]];
const DEFAULT_PAYS = ["UPI","Cash","Debit Card","Credit Card","Net Banking","Other"];
const DEFAULT_THEME = "gold";
const THEMES = {
  teal:   {name:"Teal & Coral",   c:["#1E7A73","#E07A5F"], bar:"#134E4A"},
  purple: {name:"Royal Purple",   c:["#5B3CC4","#FF7A59"], bar:"#35207E"},
  gold:   {name:"Black & Gold",   c:["#1F1F24","#D9A21B"], bar:"#111114"},
  wine:   {name:"Wine & Peach",   c:["#9B2C5A","#F08A5D"], bar:"#5C1636"}
};
function applyTheme(){
  const t = THEMES[D.settings.theme] ? D.settings.theme : DEFAULT_THEME;
  document.documentElement.dataset.theme = t;
  document.documentElement.classList.toggle("no-anim", D.settings.anim===false);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = THEMES[t].bar;
}
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function freshData(){
  return {
    version: 1,
    expenses: [],
    categories: DEFAULT_CATS.map(([icon,name],i)=>({id:"c"+(i+1), name, icon, color:COLORS[i%COLORS.length], budget:0})),
    payments: DEFAULT_PAYS.map((name,i)=>({id:"p"+(i+1), name})),
    notes: [],       // private notes
    credits: [],     // money coming in
    projects: [],    // projects
    pexp: [],        // project expenses (kept separate from daily expenses)
    people: [],      // friends & family
    loans: [],       // money given (gave) or received (got) with each person
    settings: { lastBackup:null, lastPay:"p1", hideInstall:false, theme:DEFAULT_THEME, anim:true }
  };
}
function loadData(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return freshData();
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.expenses) || !Array.isArray(d.categories)) return freshData();
    return normalise(d);
  }catch(e){ console.error(e); return freshData(); }
}
function normalise(d){
  d.payments = d.payments || DEFAULT_PAYS.map((name,i)=>({id:"p"+(i+1), name}));
  d.people = Array.isArray(d.people) ? d.people : [];
  d.loans = Array.isArray(d.loans) ? d.loans : [];
  d.credits = Array.isArray(d.credits) ? d.credits : [];
  d.projects = Array.isArray(d.projects) ? d.projects : [];
  d.pexp = Array.isArray(d.pexp) ? d.pexp : [];
  d.notes = Array.isArray(d.notes) ? d.notes.filter(n=>n && typeof n.text==="string") : [];
  d.settings = Object.assign({lastBackup:null,lastPay:"p1",hideInstall:false,theme:DEFAULT_THEME,anim:true}, d.settings||{});
  if(!THEMES[d.settings.theme]) d.settings.theme = DEFAULT_THEME;
  return d;
}
let D = loadData();
let storageOK = true;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(D)); storageOK = true; }
  catch(e){ storageOK = false; toast("Could not save! Storage is full or blocked."); }
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = (n) => String(n).padStart(2,"0");
const ymd = (d) => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());   // local date, not UTC
const todayStr = () => ymd(new Date());
const parseDate = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const daysIn = (y,m) => new Date(y, m+1, 0).getDate();   // m = 0..11
const nf = new Intl.NumberFormat("en-IN",{maximumFractionDigits:2,minimumFractionDigits:0});
const nf2 = new Intl.NumberFormat("en-IN",{maximumFractionDigits:2,minimumFractionDigits:2});
function money(paise){
  const neg = paise < 0; const v = Math.abs(paise)/100;
  const s = (Math.abs(paise) % 100 === 0) ? nf.format(v) : nf2.format(v);
  return (neg?"-":"") + "₹" + s;
}
const rup = (paise) => money(Math.round(paise/100)*100);   // whole rupees for the small top cards
function shortMoney(paise){
  const v = paise/100;
  if(v >= 10000000) return "₹"+(v/10000000).toFixed(1).replace(/\.0$/,"")+"Cr";
  if(v >= 100000) return "₹"+(v/100000).toFixed(1).replace(/\.0$/,"")+"L";
  if(v >= 1000) return "₹"+(v/1000).toFixed(1).replace(/\.0$/,"")+"k";
  return "₹"+Math.round(v);
}
function dayLabel(s){
  const t = todayStr();
  const y = new Date(); y.setDate(y.getDate()-1);
  if(s === t) return "Today";
  if(s === ymd(y)) return "Yesterday";
  return parseDate(s).toLocaleDateString("en-IN",{weekday:"short", day:"numeric", month:"short", year: s.slice(0,4)===t.slice(0,4)?undefined:"numeric"});
}
const catById = (id) => D.categories.find(c=>c.id===id) || {id, name:"(deleted category)", icon:"❔", color:"#999", budget:0};
const payById = (id) => D.payments.find(p=>p.id===id) || {id, name:"—"};
const totalBudget = () => D.categories.reduce((a,c)=>a+(c.budget||0),0);
function sum(list){ return list.reduce((a,e)=>a+e.amount,0); }
function inMonth(y,m){ const p = y+"-"+pad(m+1); return D.expenses.filter(e=>e.date.startsWith(p)); }
function inYear(y){ const p = String(y)+"-"; return D.expenses.filter(e=>e.date.startsWith(p)); }
function sorted(list){ return list.slice().sort((a,b)=> b.date.localeCompare(a.date) || (b.created||0)-(a.created||0)); }
function hexA(hex, a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function daysCounted(y,m){       // days of the month that have started so far
  const now = new Date(); const ny = now.getFullYear(), nm = now.getMonth();
  if(y<ny || (y===ny && m<nm)) return daysIn(y,m);
  if(y===ny && m===nm) return now.getDate();
  return 0;
}
function parseAmount(str){       // allows "120" or "120+80+15.5"
  const parts = String(str).replace(/,/g,"").split("+").map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return NaN;
  let total = 0;
  for(const p of parts){ if(!/^\d*\.?\d+$/.test(p) && !/^\d+\.?$/.test(p)) return NaN; total += Math.round(parseFloat(p)*100); }
  return total;
}
let toastTimer;
function toast(msg){
  let t = $(".toast"); if(!t){ t = document.createElement("div"); t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove("hidden"); void t.offsetWidth; t.classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}

/* ---------- view state ---------- */
const now0 = new Date();
const V = { tab:"home", y: now0.getFullYear(), m: now0.getMonth(), year: now0.getFullYear(), showAll:false, monthList:false };

/* =========================================================
   Rendering
   ========================================================= */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.tab===V.tab));
  const main = $("#main");
  if(V.tab==="home") main.innerHTML = homeView();
  if(V.tab==="month") main.innerHTML = monthView();
  if(V.tab==="year") main.innerHTML = yearView();
  if(V.tab==="settings") main.innerHTML = settingsView();
  if(V.tab==="notes") main.innerHTML = notesView();
  if(V.tab==="credits") main.innerHTML = creditsView();
  if(V.tab==="projects") main.innerHTML = projectsView();
  if(V.tab==="people") main.innerHTML = V.person && D.people.some(p=>p.id===V.person) ? personView(V.person) : peopleView();
  const sub = {home:"Your money, only on this device", month:"Monthly summary", year:"Yearly summary", settings:"Theme, categories & backup", people:"Money with friends & family", notes:"Private notes, only on this device", credits:"Money coming in", projects:"Each project kept separate"};
  $("#title").textContent = {home:"Expenses", month:"Month", year:"Year", settings:"Settings", people:"Lend & Borrow", notes:"Notes", credits:"Credits", projects:"Projects"}[V.tab];
  document.querySelectorAll(".gear").forEach(g=>g.classList.toggle("on", g.dataset.tab===V.tab));
  $("#hBack").classList.toggle("hidden", !isSubView());
  if(V.tab==="people" && V.person && personById(V.person)){ $("#title").textContent = personById(V.person).name; $("#subtitle").textContent = "Lend & Borrow"; }
  if(V.tab==="projects" && V.project && projectById(V.project)){ $("#title").textContent = projectById(V.project).name; $("#subtitle").textContent = "Project"; }
  $("#subtitle").textContent = sub[V.tab];
  afterRender();
  V.flash = null;
}

/* ---------- navigation (back button + browser history) ---------- */
let navDepth = 0, curState = null;
const SUB_TABS = ["credits","projects","notes","settings"];
function isSubView(){ return SUB_TABS.includes(V.tab) || !!V.person || !!V.project; }
function stateNow(){ return {tab:V.tab, person:V.person||null, project:V.project||null, y:V.y, m:V.m, year:V.year, d:navDepth}; }
function go(tab, extra){
  extra = extra || {};
  const next = {tab, person:extra.person||null, project:extra.project||null};
  if(next.tab===V.tab && next.person===(V.person||null) && next.project===(V.project||null)){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  V.tab = next.tab; V.person = next.person; V.project = next.project; V.showAll = false;
  navDepth++; curState = stateNow();
  try{ history.pushState(curState, ""); }catch(e){}
  render(); window.scrollTo(0,0);
}
function goBack(){
  if(navDepth > 0){ history.back(); return; }
  // opened directly (no history): go to the parent screen
  if(V.person) V.person = null;
  else if(V.project) V.project = null;
  else V.tab = "home";
  curState = stateNow(); try{ history.replaceState(curState, ""); }catch(e){}
  render(); window.scrollTo(0,0);
}
window.addEventListener("popstate", (e)=>{
  if(closeSheet){ closeSheet(); try{ history.pushState(curState, ""); }catch(err){} return; }   // back closes an open pop-up first
  const st = e.state;
  if(st && st.tab){ V.tab = st.tab; V.person = st.person; V.project = st.project; navDepth = st.d||0;
    if(st.y!==undefined){ V.y = st.y; V.m = st.m; V.year = st.year; } }
  else { V.tab = "home"; V.person = null; V.project = null; navDepth = 0; }
  V.showAll = false; curState = stateNow(); render(); window.scrollTo(0,0);
});

/* ---------- animation helpers ---------- */
let lastKey = null, animDir = null;
const prevVals = new Map();
const motionOK = () => D.settings.anim !== false && !matchMedia("(prefers-reduced-motion: reduce)").matches;
function cnt(v, ck, fmt){   // a number that counts up/down when it changes
  return `<span data-count="${Math.round(v)}" data-ck="${ck}" data-fmt="${fmt||""}">${fmt==="rup"?rup(v):money(Math.round(v))}</span>`;
}
function countUp(el, from, to, fmt){
  const f = fmt==="rup" ? rup : money, t0 = performance.now(), dur = 700;
  const step = (now)=>{
    if(!el.isConnected) return;
    const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,3), v = from+(to-from)*e;
    el.textContent = p<1 ? f(Math.round(v/100)*100) : f(to);
    if(p<1) requestAnimationFrame(step);
  };
  el.textContent = f(from); requestAnimationFrame(step);
}
function afterRender(){
  const main = $("#main");
  const key = [V.tab, V.person||"", V.project||"", V.y, V.m, V.year].join("|");
  const fresh = key !== lastKey; lastKey = key;
  const ok = motionOK();
  main.classList.remove("fresh","slide-l","slide-r");
  if(ok && fresh){
    void main.offsetWidth;
    main.classList.add("fresh");
    if(animDir){ main.classList.add(animDir==="l"?"slide-l":"slide-r"); }
    else {
      let i = 0;
      main.querySelectorAll(":scope > *, :scope > .list > .item, :scope > .cols > .card, :scope > #notesList .note-card, :scope > .notes-grid > .note-card, :scope > .tiles > .tile").forEach(el=>{
        el.style.animationDelay = Math.min(i,14)*35 + "ms"; el.classList.add("rise"); i++;
      });
    }
  }
  animDir = null;
  main.querySelectorAll("[data-ck]").forEach(el=>{
    const ck = el.dataset.ck, to = Number(el.dataset.count);
    const from = fresh ? 0 : (prevVals.has(ck) ? prevVals.get(ck) : to);
    if(ok && from !== to) countUp(el, from, to, el.dataset.fmt);
    prevVals.set(ck, to);
  });
}
function animOut(id, done){        // slide an item away, then redraw
  const el = document.querySelector(`#main [data-id="${id}"]`);
  if(!el || !motionOK()){ done(); return; }
  el.style.height = el.offsetHeight + "px"; el.classList.add("leaving");
  setTimeout(done, 280);
}
function confetti(){
  if(!motionOK()) return;
  const css = getComputedStyle(document.documentElement);
  const cols = [css.getPropertyValue("--A").trim()||"#D9A21B", "#22885A", "#F2A541", "#5B8DEF", "#E07A5F", "#8E6CCF"];
  for(let i=0;i<34;i++){
    const d = document.createElement("i"); d.className = "conf"; d.style.background = cols[i%cols.length];
    document.body.appendChild(d);
    const ang = Math.random()*Math.PI*2, dist = 70+Math.random()*150;
    d.animate([
      {transform:"translate(-50%,-50%) rotate(0deg)", opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist*0.7 - 40}px)) rotate(${Math.random()*360}deg)`, opacity:1, offset:.45},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*dist*1.2}px), calc(-50% + ${Math.sin(ang)*dist*0.7 + 220}px)) rotate(${Math.random()*720}deg)`, opacity:0}
    ], {duration:1100+Math.random()*600, easing:"cubic-bezier(.2,.6,.4,1)"}).onfinish = ()=>d.remove();
  }
}

function itemHTML(e){
  const c = catById(e.cat), p = payById(e.pay);
  const s = [p.name, e.note].filter(Boolean).map(esc).join(" · ");
  return `<button class="item ${e.id===V.flash?"flash":""}" data-act="edit" data-id="${e.id}">
    <div class="ico" style="background:${hexA(c.color,.16)}">${esc(c.icon)}</div>
    <div class="mid"><div class="t">${esc(c.name)}</div><div class="s">${s}</div></div>
    <div class="amt">${money(e.amount)}</div></button>`;
}
function groupedList(list, limit){
  const items = sorted(list);
  const shown = limit ? items.slice(0, limit) : items;
  let html = "", cur = null, buf = [];
  const flush = () => {
    if(cur===null) return;
    const dayTotal = sum(items.filter(e=>e.date===cur));
    html += `<div class="day-h"><span>${esc(dayLabel(cur))}</span><span>${money(dayTotal)}</span></div><div class="list">${buf.join("")}</div>`;
  };
  for(const e of shown){ if(e.date!==cur){ flush(); cur=e.date; buf=[]; } buf.push(itemHTML(e)); }
  flush();
  return { html, more: items.length - shown.length };
}

function homeView(){
  const t = todayStr(), now = new Date();
  const todayT = sum(D.expenses.filter(e=>e.date===t));
  const monthT = sum(inMonth(now.getFullYear(), now.getMonth()));
  const yearT = sum(inYear(now.getFullYear()));
  const bud = totalBudget();
  let h = "";
  // install hint
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;

function dailyChart(y,m){
  const n = daysIn(y,m), vals = new Array(n).fill(0);
  inMonth(y,m).forEach(e=>{ vals[parseInt(e.date.slice(8,10))-1] += e.amount; });
  const max = Math.max(...vals, 1), W = 420, H = 170, pl = 4, pb = 18, bw = (W-pl*2)/n;
  const t = todayStr();
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending by day">`;
  s += `<line x1="0" y1="${H-pb}" x2="${W}" y2="${H-pb}" stroke="var(--line)"/>`;
  vals.forEach((v,i)=>{
    const bh = v ? Math.max(3,(v/max)*(H-pb-22)) : 0, x = pl + i*bw + bw*0.15, w = bw*0.7;
    const isT = (y+"-"+pad(m+1)+"-"+pad(i+1))===t;
    if(bh) s += `<rect class="b" style="animation-delay:${i*14}ms" x="${x}" y="${H-pb-bh}" width="${w}" height="${bh}" rx="2.5" fill="${isT?"var(--acc)":"var(--pri)"}"><title>${i+1} ${MONTHS[m].slice(0,3)}: ${money(v)}</title></rect>`;
    if(n<=31 && ((i+1)%5===0 || i===0)) s += `<text x="${x+w/2}" y="${H-4}" text-anchor="middle">${i+1}</text>`;
  });
  s += `<text x="${W-4}" y="11" text-anchor="end">max ${money(max===1&&!vals.some(Boolean)?0:max)}</text></svg>`;
  return s;
}

function breakdownCats(list, months){   // months = number of months the budget covers
  const by = {}; list.forEach(e=>{ by[e.cat]=(by[e.cat]||0)+e.amount; });
  const ids = new Set([...Object.keys(by), ...D.categories.filter(c=>c.budget>0).map(c=>c.id)]);
  const rows = [...ids].map(id=>({c:catById(id), v:by[id]||0})).sort((a,b)=>b.v-a.v);
  if(!rows.length) return `<div class="muted small">Nothing yet.</div>`;
  const max = Math.max(...rows.map(r=>r.v),1);
  return rows.map(({c,v})=>{
    const b = (c.budget||0)*months;
    let bar, note = "";
    if(b>0){ const over=v>b; bar=`<div class="bar ${over?"over":""}"><i style="width:${Math.min(100,v/b*100)}%;${over?"":"background:"+c.color}"></i></div>`;
      note = `<div class="note ${over?"over":""}">${over? money(v-b)+" over budget ("+money(b)+")" : money(b-v)+" left of "+money(b)}</div>`; }
    else bar = `<div class="bar"><i style="width:${v/max*100}%;background:${c.color}"></i></div>`;
    return `<div class="brow"><div class="top2"><div class="ico" style="background:${hexA(c.color,.16)}">${esc(c.icon)}</div>
      <div class="name">${esc(c.name)}</div><b>${money(v)}</b></div>${bar}${note}</div>`;
  }).join("");
}
function breakdownPays(list){
  const by = {}; list.forEach(e=>{ by[e.pay]=(by[e.pay]||0)+e.amount; });
  const rows = Object.keys(by).map(id=>({p:payById(id), v:by[id]})).sort((a,b)=>b.v-a.v);
  if(!rows.length) return `<div class="muted small">Nothing yet.</div>`;
  const max = Math.max(...rows.map(r=>r.v),1);
  return rows.map(({p,v})=>`<div class="brow"><div class="top2"><div class="name">${esc(p.name)}</div><b>${money(v)}</b></div>
    <div class="bar"><i style="width:${v/max*100}%;background:var(--acc)"></i></div></div>`).join("");
}

function yearChart(y){
  const vals = MONTHS.map((_,i)=>sum(inMonth(y,i)));
  const max = Math.max(...vals,1), W=420, H=190, pb=20, bw=W/12, now=new Date();
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending by month">`;
  s += `<line x1="0" y1="${H-pb}" x2="${W}" y2="${H-pb}" stroke="var(--line)"/>`;
  vals.forEach((v,i)=>{
    const bh = v ? Math.max(3,(v/max)*(H-pb-28)) : 0, x=i*bw+bw*0.18, w=bw*0.64;
    const cur = (y===now.getFullYear() && i===now.getMonth());
    s += `<g data-act="goMonth" data-m="${i}" style="cursor:pointer"><rect x="${i*bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>`;
    if(bh){ s += `<rect class="b" style="animation-delay:${i*45}ms" x="${x}" y="${H-pb-bh}" width="${w}" height="${bh}" rx="4" fill="${cur?"var(--acc)":"var(--pri)"}"><title>${MONTHS[i]}: ${money(v)}</title></rect>`;
      s += `<text class="v" x="${x+w/2}" y="${H-pb-bh-4}" text-anchor="middle">${shortMoney(v)}</text>`; }
    s += `<text x="${x+w/2}" y="${H-5}" text-anchor="middle">${MONTHS[i].slice(0,3)}</text></g>`;
  });
  return s + `</svg>`;
}

/* =========================================================
   Sheets (pop-up panels)
   ========================================================= */
let closeSheet = null;
function openSheet(html, cls, onClose){
  if(closeSheet) closeSheet();
  const ov = document.createElement("div"); ov.className = "overlay";
  const xBtn = cls==="full" ? "" : `<div class="sheet-top"><button class="sheet-x" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  ov.innerHTML = `<div class="sheet ${cls||""}" role="dialog" aria-modal="true">${xBtn}<div class="grab"></div>${html}</div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  const close = () => {
    closeSheet=null; document.removeEventListener("keydown", onKey);
    if(onClose) onClose();
    const unlock = () => { if(!document.querySelector(".overlay:not(.closing)")) document.body.style.overflow=""; };
    if(!motionOK()){ ov.remove(); unlock(); return; }
    ov.classList.add("closing"); setTimeout(()=>{ ov.remove(); unlock(); }, 200);
  };
  const onKey = (e) => { if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
  ov.addEventListener("click", (e)=>{ if(e.target===ov || e.target.closest(".sheet-x")) close(); });
  // swipe the pop-up down to close it (drag from the top part)
  const sh = ov.querySelector(".sheet");
  if(cls!=="full"){
    let y0 = null, dy = 0;
    sh.addEventListener("touchstart", (e)=>{
      const t = e.touches[0], top = sh.getBoundingClientRect().top;
      y0 = (e.touches.length===1 && sh.scrollTop<=0 && t.clientY - top < 80) ? t.clientY : null; dy = 0;
    }, {passive:true});
    sh.addEventListener("touchmove", (e)=>{
      if(y0===null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      if(dy>0){ e.preventDefault(); sh.style.transition="none"; sh.style.transform = `translateY(${dy}px)`; }
    }, {passive:false});
    sh.addEventListener("touchend", ()=>{
      if(y0===null) return; y0 = null;
      if(dy > 90){ if(document.activeElement) document.activeElement.blur(); close(); }
      else { sh.style.transition="transform .2s ease"; sh.style.transform=""; }
    });
  }
  closeSheet = close;
  return ov;
}
function ask(message, okLabel="OK", danger=false){
  return new Promise(res=>{
    let done = false;
    const ov = openSheet(`<h3>${esc(message)}</h3><div class="grid2">
      <button class="btn ghost" data-r="0">Cancel</button><button class="btn ${danger?"coral":"primary"}" data-r="1">${esc(okLabel)}</button></div>`,
      "", ()=>{ if(!done){ done=true; res(false); } });
    ov.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ if(done) return; done=true; res(b.dataset.r==="1"); closeSheet(); });
  });
}

/* =========================================================
   Lend & Borrow (money with friends & family)
   type "gave" = you gave money to them (lent, or paid them back)
   type "got"  = you got money from them (borrowed, or they paid you back)
   balance > 0 → they owe you;  balance < 0 → you owe them
   ========================================================= */
const personById = (id) => D.people.find(p=>p.id===id);
function balanceOf(pid){ return D.loans.reduce((a,l)=> l.person===pid ? a + (l.type==="gave"? l.amount : -l.amount) : a, 0); }
function peopleTotals(){
  let owedToMe=0, iOwe=0;
  D.people.forEach(p=>{ const b=balanceOf(p.id); if(b>0) owedToMe+=b; else iOwe+=-b; });
  return {owedToMe, iOwe};
}
const AV_COLORS = ["#E07A5F","#5B8DEF","#8E6CCF","#3FA34D","#D9577A","#2BB3B1","#B5835A","#C4A21C","#4F6D7A","#E3A21A"];
function avatar(p){
  let h=0; for(const ch of p.id) h=(h*31+ch.charCodeAt(0))>>>0;
  const ini = p.name.trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || "?";
  return `<div class="av" style="background:${AV_COLORS[h%AV_COLORS.length]}">${esc(ini)}</div>`;
}
function balText(b, name){
  if(b>0) return {cls:"cg", lb: name ? `${name} owes you` : "owes you"};
  if(b<0) return {cls:"cr", lb: name ? `You owe ${name}` : "you owe"};
  return {cls:"muted", lb:"settled ✓"};
}
function peopleView(){
  const t = peopleTotals();
  let h = `<div class="sumcards">
    <div class="sumcard g"><div class="label cg">Others owe you</div><div class="val cg">${cnt(t.owedToMe,"p-owed")}</div></div>
    <div class="sumcard r"><div class="label cr">You owe others</div><div class="val cr">${cnt(t.iOwe,"p-iowe")}</div></div></div>`;
  h += `<div style="margin-bottom:14px"><button class="btn primary block" data-act="addPerson">+ Add person</button></div>`;
  if(!D.people.length){
    return h + `<div class="card empty"><div class="e">🤝</div><p><b>No one added yet</b><br>Add a friend or family member, then note money you <b>gave</b> them or <b>got</b> from them.<br><span class="small">This is kept separate from your expenses.</span></p></div>`;
  }
  const rows = D.people.map(p=>{
    const b = balanceOf(p.id), ls = D.loans.filter(l=>l.person===p.id).sort((a,c)=>c.date.localeCompare(a.date));
    return {p, b, last: ls[0] ? ls[0].date : null};
  }).sort((a,c)=> (c.b!==0)-(a.b!==0) || Math.abs(c.b)-Math.abs(a.b) || a.p.name.localeCompare(c.p.name));
  h += `<div class="list">` + rows.map(({p,b,last})=>{
    const bt = balText(b);
    return `<button class="item" data-act="person" data-id="${p.id}">${avatar(p)}
      <div class="mid"><div class="t">${esc(p.name)}</div><div class="s">${last? "Last entry: "+esc(dayLabel(last)) : "No entries yet"}</div></div>
      <div class="bal"><div class="amt ${bt.cls}">${b?money(Math.abs(b)):""}</div><div class="lb ${bt.cls}">${bt.lb}</div></div></button>`;
  }).join("") + `</div>`;
  return h;
}
function personView(pid){
  const p = personById(pid), b = balanceOf(pid), bt = balText(b, p.name);
  const ls = D.loans.filter(l=>l.person===pid);
  let h = "";
  h += `<div class="card pcard">${avatar(p)}<div style="font-weight:800;font-size:18px">${esc(p.name)}</div>
    <div class="big2 ${bt.cls}" style="margin-top:6px">${cnt(Math.abs(b),"p-bal-"+pid)}</div>
    <div class="${bt.cls}" style="font-weight:700;margin-bottom:14px">${esc(bt.lb)}</div>
    <div class="grid2"><button class="btn give" data-act="gave" data-id="${pid}">↑ I gave</button><button class="btn get" data-act="got" data-id="${pid}">↓ I got</button></div>
    <div class="row" style="justify-content:center;gap:18px;margin-top:12px">
      ${b?`<button class="link" data-act="settle" data-id="${pid}">Settle up</button>`:""}

/* =========================================================
   Notes (a simple private notepad, like iPhone Notes)
   Each note: {id, text, created, updated, pinned}. The first line is the title.
   ========================================================= */
function noteTitle(n){ const l = n.text.split("\n").map(s=>s.trim()).find(Boolean) || "New note"; return l.length>80 ? l.slice(0,80)+"…" : l; }
function notePreview(n){
  const lines = n.text.split("\n").map(s=>s.trim()).filter(Boolean);
  const rest = lines.slice(1).join("  ·  ");
  return rest.length>140 ? rest.slice(0,140)+"…" : rest;
}
function noteDate(ts){
  const d = new Date(ts), t = todayStr(), y = new Date(); y.setDate(y.getDate()-1);
  if(ymd(d)===t) return d.toLocaleTimeString("en-IN",{hour:"numeric", minute:"2-digit"});
  if(ymd(d)===ymd(y)) return "Yesterday";
  return d.toLocaleDateString("en-IN",{day:"numeric", month:"short", year: d.getFullYear()===new Date().getFullYear()?undefined:"numeric"});
}
const sortedNotes = () => D.notes.slice().sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.updated-a.updated);
function noteCard(n){
  const pv = notePreview(n);
  return `<button class="note-card ${n.id===V.flash?"flash":""}" data-act="openNote" data-id="${n.id}">
    <div class="nt">${n.pinned?"📌 ":""}${esc(noteTitle(n))}</div>
    <div class="np"><span class="nd">${esc(noteDate(n.updated))}</span>${pv?"  "+esc(pv):'<span class="muted"> No more text</span>'}</div></button>`;
}
function notesListHTML(q){
  if(!D.notes.length) return `<div class="card empty"><div class="e">📝</div><p><b>No notes yet</b><br>Write anything — ideas, reminders, shopping lists.<br><span class="small">Notes are saved only on this device.</span></p></div>`;
  const qq = (q||"").trim().toLowerCase();
  const list = sortedNotes().filter(n=> !qq || n.text.toLowerCase().includes(qq));
  if(!list.length) return `<div class="card empty"><p>No notes match “${esc(q)}”.</p></div>`;
  const pinned = list.filter(n=>n.pinned), others = list.filter(n=>!n.pinned);
  let h = "";
  if(pinned.length) h += `<div class="day-h"><span>Pinned</span></div><div class="notes-grid">${pinned.map(noteCard).join("")}</div>`;
  if(others.length) h += `<div class="day-h"><span>${pinned.length?"Notes":list.length+" note"+(list.length>1?"s":"")}</span></div><div class="notes-grid">${others.map(noteCard).join("")}</div>`;
  return h;
}
function notesView(){
  return `<div class="row" style="gap:10px;margin-bottom:6px">
      <input class="inp" id="nSearch" type="search" placeholder="🔍  Search notes" value="${esc(V.noteQ||"")}" style="flex:1" autocomplete="off">
      <button class="btn primary" data-act="newNote">+ New</button></div>
    <div id="notesList">${notesListHTML(V.noteQ||"")}</div>`;
}
function openNote(id){
  let n = id ? D.notes.find(x=>x.id===id) : null;
  let timer = null;
  const ta_html = `<div class="ned-top">
      <button class="back" data-nback style="margin:0">‹ Notes</button>
      <div class="row" style="gap:4px">
        <button class="iconbtn ${n&&n.pinned?"on":""}" id="nPin" aria-label="Pin note" title="Pin">📌</button>
        <button class="iconbtn" id="nShare" aria-label="Share or copy" title="Share / copy">📤</button>
        <button class="iconbtn" id="nDelete" aria-label="Delete note" title="Delete">🗑️</button>
        <button class="btn primary" id="nDone" style="padding:8px 14px;margin-left:4px">Done</button>
      </div></div>
    <div class="ned-meta" id="nMeta">${n ? "Edited "+esc(noteDate(n.updated)) : "New note"}</div>
    <textarea id="nText" class="ned" placeholder="Start writing…" spellcheck="true">${esc(n?n.text:"")}</textarea>`;
  const persist = ()=>{
    clearTimeout(timer);
    const txt = ta.value;
    if(!n){ if(!txt.trim()) return; n = {id:"n"+uid(), text:txt, created:Date.now(), updated:Date.now(), pinned:false}; D.notes.push(n); save(); }
    else if(n.text !== txt){ n.text = txt; n.updated = Date.now(); save(); }
    if(meta.isConnected) meta.textContent = "Saved ✓";
  };
  const onClose = ()=>{
    persist();
    if(n && !n.text.trim()){ D.notes = D.notes.filter(x=>x!==n); save(); }
    else if(n) V.flash = n.id;
    render();
  };
  const ov = openSheet(ta_html, "full", onClose);
  const ta = $("#nText",ov), meta = $("#nMeta",ov);
  setTimeout(()=>{ ta.focus(); if(n){ ta.setSelectionRange(ta.value.length, ta.value.length); } }, 80);
  ta.addEventListener("input", ()=>{ meta.textContent = "Saving…"; clearTimeout(timer); timer = setTimeout(persist, 400); });
  $("[data-nback]",ov).onclick = ()=>closeSheet();
  $("#nDone",ov).onclick = ()=>closeSheet();
  $("#nPin",ov).onclick = (e)=>{
    persist(); if(!n){ toast("Write something first"); return; }
    n.pinned = !n.pinned; save(); e.currentTarget.classList.toggle("on", n.pinned); toast(n.pinned?"Pinned":"Unpinned");
  };
  $("#nShare",ov).onclick = async ()=>{
    const txt = ta.value; if(!txt.trim()){ toast("Nothing to share yet"); return; }
    const touch = matchMedia("(pointer:coarse)").matches;
    try{
      if(touch && navigator.share){ await navigator.share({text:txt}); return; }
      await navigator.clipboard.writeText(txt); toast("Copied ✓");
    }catch(err){ if(!(err && err.name==="AbortError")) toast("Could not copy"); }
  };
  $("#nDelete",ov).onclick = async ()=>{
    persist();
    if(!n){ closeSheet(); return; }
    const id = n.id; closeSheet();
    if(await ask(`Delete note “${noteTitle(n)}”?`,"Delete",true)){
      D.notes = D.notes.filter(x=>x.id!==id); save(); animOut(id, render); toast("Note deleted");
    } else openNote(id);
  };
}
async function exportNotes(){
  if(!D.notes.length){ toast("No notes to export"); return; }
  const parts = sortedNotes().map(n=>`${new Date(n.updated).toLocaleString("en-IN")}${n.pinned?"   (pinned)":""}\n\n${n.text.trim()}`);
  await shareOrDownload(`notes-${todayStr()}.txt`, parts.join("\n\n------------------------------\n\n")+"\n", "text/plain");
}


/* =========================================================
   Credits (money coming in) — kept separate from expenses
   Each credit: {id, amount, date, note, created}
   ========================================================= */
function creditsIn(y,m){ const p = y+"-"+pad(m+1); return D.credits.filter(c=>c.date.startsWith(p)); }
function creditsYear(y){ const p = y+"-"; return D.credits.filter(c=>c.date.startsWith(p)); }
function creditsView(){

/* ---------- backup / restore / export ---------- */
async function shareOrDownload(filename, text, mime){
  const blob = new Blob([text], {type:mime});
  try{
    const file = new File([blob], filename, {type:mime});
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    if(ios && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return true; }
  }catch(err){ if(err && err.name==="AbortError") return false; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  return true;
}
async function backup(){
  const t = todayStr();
  const ok = await shareOrDownload(`expenses-backup-${t}.json`, JSON.stringify(D,null,1), "application/json");
  if(ok){ D.settings.lastBackup = new Date().toISOString(); save(); render(); toast("Backup saved"); }
}
async function exportCSV(){
  const q = (s)=>`"${String(s??"").replace(/"/g,'""')}"`;
  const rows = [["Date","Category","Payment Mode","Amount (INR)","Note"].join(",")];
  sorted(D.expenses).reverse().forEach(e=>rows.push([e.date, q(catById(e.cat).name), q(payById(e.pay).name), (e.amount/100).toFixed(2), q(e.note)].join(",")));
  await shareOrDownload(`expenses-${todayStr()}.csv`, "﻿"+rows.join("\r\n"), "text/csv");
}
function restoreFrom(file){
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.expenses) || !Array.isArray(d.categories)) throw new Error("bad");
      const okAmounts = d.expenses.concat(Array.isArray(d.loans)?d.loans:[], Array.isArray(d.credits)?d.credits:[], Array.isArray(d.pexp)?d.pexp:[]).every(e=>Number.isInteger(e.amount) && /^\d{4}-\d{2}-\d{2}$/.test(e.date));
      if(!okAmounts) throw new Error("bad");
      if(d.notes && (!Array.isArray(d.notes) || !d.notes.every(n=>n && typeof n.text==="string"))) throw new Error("bad");
      if(await ask(`Replace current data (${D.expenses.length} entries) with this backup (${d.expenses.length} entries)?`,"Restore",true)){
        const th = D.settings.theme; const hadTheme = d.settings && d.settings.theme;
        D = normalise(d); if(!hadTheme) D.settings.theme = th;
        V.person=null; V.project=null; V.tab="home"; navDepth=0; curState=stateNow(); try{history.replaceState(curState,"");}catch(e){} applyTheme(); save(); render(); toast("Backup restored");
      }
    }catch(err){ toast("This file is not a valid backup."); }
  };
  r.readAsText(file);
}

  else if(act==="install" && deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; }
  else if(act==="wipe"){
    if(await ask("Delete ALL expenses, credits, projects, people, notes, categories and settings on this device? This cannot be undone.","Delete everything",true)){
      const th = D.settings.theme; D = freshData(); D.settings.theme = th; V.person=null; V.project=null; V.tab="home"; navDepth=0; curState=stateNow(); try{history.replaceState(curState,"");}catch(e){} save(); render(); toast("All data deleted"); }
  }
});
$("#fab").onclick = ()=>openExpense(null);
$("#restoreFile").onchange = (e)=>{ const f=e.target.files[0]; if(f) restoreFrom(f); e.target.value=""; };
document.addEventListener("keydown",(e)=>{    // Esc = back on inner screens (desktop)
  if(e.key==="Escape" && !closeSheet && isSubView() && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) goBack();
});
document.addEventListener("keydown",(e)=>{    // desktop shortcut: press N to add
  if(!closeSheet && (e.key==="n"||e.key==="N") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !e.ctrlKey && !e.metaKey){ e.preventDefault(); if(V.tab==="notes") openNote(null); else if(V.tab==="credits") openCredit(null); else if(V.tab==="projects" && V.project) openPexp(V.project,null); else openExpense(null); }
});
document.addEventListener("input",(e)=>{     // live search in Notes
  if(e.target && e.target.id==="nSearch"){ V.noteQ = e.target.value; const box=$("#notesList"); if(box) box.innerHTML = notesListHTML(V.noteQ); }
});
window.addEventListener("storage",(e)=>{ if(e.key===KEY){ D=loadData(); applyTheme(); render(); } });   // keep two windows in sync
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); deferredPrompt=e; if(V.tab==="home") render(); });
window.addEventListener("appinstalled",()=>{ D.settings.hideInstall=true; save(); render(); toast("App installed"); });
// refresh "today" when the app comes back after midnight
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !closeSheet) render(); });

/* ---------- no pinch-zoom on phones (feels like a normal app) ---------- */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,(e)=>e.preventDefault(),{passive:false}));   // iPhone Safari pinch
document.addEventListener("touchmove",(e)=>{ if(e.touches && e.touches.length>1) e.preventDefault(); },{passive:false});            // two-finger zoom

if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW failed",err));
}
applyTheme();
curState = stateNow(); try{ history.replaceState(curState, ""); }catch(e){}
render();
</script>
</body>
</html>
